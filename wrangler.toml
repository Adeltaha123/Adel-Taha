# My PA on Cloudflare Workers (free plan): the website and its API on one address, with a D1 database.
# See docs/CLOUDFLARE.md. Deploy with `npm run deploy`, which builds the website first.
name = "mypa-api"
main = "server/worker.ts"
account_id = "c7f3c1ecae843ecacbc4a1d1b38147a8"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# The website (the Expo web build) is served from the same origin as the API, so browsers make no cross-site
# requests; Safari and content blockers can block those to *.workers.dev. Only /api/* runs the Worker code.
[assets]
directory = "./mobile/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
API_ORIGINS = "https://adeltaha123.github.io,http://localhost:8081,http://127.0.0.1:8081"
NODE_ENV = "production"
# The free plan allows about 10 ms of CPU per request; 10,000 PBKDF2 rounds stays well inside it.
# On the $5 Workers plan raise this (for example to 210000); existing passwords upgrade at their next login.
PASSWORD_ITERATIONS = "10000"
# Who people contact to subscribe, shown on the Account screen.
SUBSCRIBE_CONTACT = ""
# Secrets are set with `npx wrangler secret put NAME`, never here: OPENAI_API_KEY, ADMIN_TOKEN.

[[d1_databases]]
binding = "DB"
database_name = "mypa"
database_id = "2dab885a-0fbd-42bd-ac85-dd8b8a7c6076"

[observability]
enabled = true
