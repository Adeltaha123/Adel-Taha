<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maktab Assistant</title>
<meta name="theme-color" content="#14201C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maktab">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-column phone app, sticky header, fixed bottom nav with a centered capture button; desktop centers a 560px column. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --sunk:#E8ECE8; --ink:#14201C; --muted:#5B6964; --line:#D8DEDA;
  --accent:#0E6B5C; --accent-soft:#D8EDE7; --on-accent:#FFFFFF; --gold:#A87A22; --gold-soft:#F4E9D2;
  --q1:#C0402C; --q2:#0E6B5C; --q3:#A87A22; --q4:#7A8681; --danger:#B3261E; --shadow:0 8px 28px rgba(20,32,28,.12);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Readex Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1311; --surface:#141E1B; --sunk:#1B2723; --ink:#E6EDE9; --muted:#93A39D; --line:#26342F;
  --accent:#43B9A2; --accent-soft:#16352E; --on-accent:#06120F; --gold:#E2B45C; --gold-soft:#33291A;
  --q1:#F2806A; --q2:#43B9A2; --q3:#E2B45C; --q4:#7F8E88; --danger:#F2806A; --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1311; --surface:#141E1B; --sunk:#1B2723; --ink:#E6EDE9; --muted:#93A39D; --line:#26342F;
  --accent:#43B9A2; --accent-soft:#16352E; --on-accent:#06120F; --gold:#E2B45C; --gold-soft:#33291A;
  --q1:#F2806A; --q2:#43B9A2; --q3:#E2B45C; --q4:#7F8E88; --danger:#F2806A; --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px 10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand .mark{width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:15px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.pill-btn{height:40px;padding-inline:14px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);font-weight:600;display:flex;align-items:center;gap:6px}
.pill-btn svg{width:18px;height:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
h2{font-size:17px;font-weight:600}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.section{display:flex;flex-direction:column;gap:10px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.banner{font-size:13px;padding:10px 12px;border-radius:12px;background:var(--gold-soft);color:var(--ink)}
.btn{height:44px;padding-inline:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
input.field,textarea.field,select.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;outline:none}
input.field:focus,textarea.field:focus{border-color:var(--accent)}
textarea.field{resize:vertical;min-height:120px;line-height:1.6}

/* Top 3 */
.top3{background:var(--ink);color:var(--bg);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.top3 .eyebrow{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.top3 .slot{display:flex;align-items:center;gap:12px;padding-block:6px;border-top:1px solid color-mix(in srgb,var(--bg) 16%,transparent)}
.top3 .slot:first-of-type{border-top:0}
.top3 .num{font-family:var(--f-mono);font-size:13px;color:var(--gold);width:18px}
.top3 .slot .t{flex:1;min-width:0;font-weight:500}
.top3 .empty{color:color-mix(in srgb,var(--bg) 60%,transparent);font-size:14px}
.top3 .check{border-color:color-mix(in srgb,var(--bg) 50%,transparent)}

/* tasks */
.task{display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;border-inline-start:4px solid var(--qc,var(--line))}
.task .body{flex:1;min-width:0;cursor:pointer}
.task .title{font-weight:500;overflow-wrap:anywhere}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.late{background:color-mix(in srgb,var(--q1) 16%,transparent);color:var(--q1)}
.chip.today{background:var(--gold-soft);color:var(--gold)}
.chip.star{background:var(--gold-soft);color:var(--gold)}
.check{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0;margin-top:1px}
.check svg{width:14px;height:14px;opacity:0}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.check.on svg{opacity:1}
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quad{border-radius:14px;padding:10px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;min-width:0;border-top:4px solid var(--qc)}
.quad h3{font-size:14px;display:flex;justify-content:space-between;gap:6px}
.quad .hint{font-size:11px;color:var(--muted);line-height:1.35}
.mini{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.35;cursor:pointer}
.mini .check{width:18px;height:18px;border-radius:5px}
.mini .check svg{width:11px;height:11px}
.mini span{overflow-wrap:anywhere;min-width:0}
.mini.done span{text-decoration:line-through;color:var(--muted)}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;height:34px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.qpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qpick button{text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-size:13px;border-inline-start:4px solid var(--qc)}
.qpick button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--qc)}
.qpick b{display:block;font-size:14px}

/* capture */
.capture-box{position:relative}
.voice-hint{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--accent-soft);font-size:13px}
.voice-hint svg{flex:none;width:22px;height:22px;color:var(--accent)}
.result{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);border-inline-start:4px solid var(--qc,var(--line))}
.result .why{font-size:12px;color:var(--muted)}
.lang-tag{font-family:var(--f-mono);font-size:11px;padding:2px 6px;border-radius:6px;background:var(--sunk);color:var(--muted)}

/* notes */
.note{white-space:pre-wrap;overflow-wrap:anywhere}
.note-meta{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}

/* habits */
.habit{display:flex;flex-direction:column;gap:10px}
.habit .hrow{display:flex;justify-content:space-between;gap:8px;align-items:center}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);background:none;border:0;padding:0}
.dot{width:32px;height:32px;border-radius:10px;border:1.5px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.dot.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dot.today{border-color:var(--gold)}
.dot svg{width:14px;height:14px}
.streak{font-family:var(--f-mono);font-size:12px;color:var(--gold)}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-end-end-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-end-start-radius:4px}
.msg.tool{align-self:flex-start;font-size:12px;color:var(--accent);background:var(--accent-soft);padding:4px 10px}
.composer{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding-block:8px}
.composer textarea{min-height:46px;max-height:140px}
.suggest{display:flex;gap:6px;flex-wrap:wrap}
.suggest button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}

/* nav */
nav.tabs{position:fixed;inset:auto 0 0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:68px}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding-block:8px;font-weight:500}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .fab{position:relative;top:-14px}
nav.tabs .fab .disc{width:58px;height:58px;border-radius:20px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:var(--shadow)}
nav.tabs .fab .disc svg{width:26px;height:26px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(6,12,10,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);align-self:center}
.cl-item{display:flex;gap:10px;align-items:center;padding-block:6px;border-bottom:1px solid var(--line)}
.cl-item span{flex:1;min-width:0;overflow-wrap:anywhere}
.cl-item.done span{text-decoration:line-through;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.x svg{width:16px;height:16px}
.progress{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}

/* lock */
.lock{position:fixed;inset:0;z-index:60;background:var(--ink);color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));text-align:center}
.lock h1{color:var(--bg)}
.lock .sub{color:color-mix(in srgb,var(--bg) 70%,transparent);font-size:14px;max-width:32ch}
.pins{display:flex;gap:12px;justify-content:center}
.pins i{width:14px;height:14px;border-radius:50%;border:2px solid color-mix(in srgb,var(--bg) 60%,transparent)}
.pins i.on{background:var(--gold);border-color:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center;direction:ltr}
.pad button{width:72px;height:72px;border-radius:50%;border:1px solid color-mix(in srgb,var(--bg) 22%,transparent);background:color-mix(in srgb,var(--bg) 6%,transparent);color:var(--bg);font-family:var(--f-display);font-size:24px}
.pad button.blank{visibility:hidden}
.pad button svg{width:24px;height:24px}
.bio-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--gold);color:var(--gold);background:transparent;border-radius:14px;padding:12px 18px;font-weight:600}
.bio-btn svg{width:26px;height:26px}
.lock .err{color:var(--gold);min-height:20px;font-size:14px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.matrix{grid-template-columns:1fr}}
[dir="rtl"] .flip{transform:scaleX(-1)}
/* voice */
.mic-hero{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--accent);color:var(--on-accent);border:0;text-align:start;width:100%}
.mic-hero .disc{flex:none;width:54px;height:54px;border-radius:50%;background:color-mix(in srgb,var(--on-accent) 18%,transparent);display:grid;place-items:center}
.mic-hero svg{width:26px;height:26px}
.mic-hero b{display:block;font-family:var(--f-display);font-size:17px}
.mic-hero span{font-size:13px;opacity:.85}
.rec-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:8px}
.rec-btn{width:112px;height:112px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:var(--shadow);position:relative}
.rec-btn svg{width:44px;height:44px}
.rec-btn.on{background:var(--q1)}
.rec-btn.on::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--q1);opacity:.5;animation:pulse 1.4s ease-out infinite}
@keyframes pulse{from{transform:scale(.9);opacity:.6}to{transform:scale(1.25);opacity:0}}
.timer{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.live{min-height:120px}
.interim{color:var(--muted)}
audio{width:100%;height:40px}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><span class="mark">م</span><span>Maktab</span></div>
    <button class="pill-btn" id="askBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9.5 13.9 11.4 12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg><span data-t="ask">Ask</span></button>
    <button class="iconbtn" id="menuBtn" type="button" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
  </header>
  <main id="view" class="stack"></main>
</div>

<nav class="tabs" aria-label="Main">
  <div class="inner">
    <button type="button" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span data-t="today">Today</span></button>
    <button type="button" data-tab="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg><span data-t="tasks">Tasks</span></button>
    <button type="button" id="fabMic" class="fab" aria-label="Voice note"><span class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v4"/></svg></span></button>
    <button type="button" data-tab="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg><span data-t="notes">Notes</span></button>
    <button type="button" data-tab="habits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l4 4L17 6"/><path d="M13 16l1 1 7-7"/></svg><span data-t="habits">Habits</span></button>
  </div>
</nav>

<div class="lock" id="lock">
  <div class="brand" style="flex:none;color:var(--bg)"><span class="mark" style="background:var(--gold);color:var(--ink)">م</span><span>Maktab</span></div>
  <div class="spinner" style="color:var(--gold)"></div>
</div>

<script>

/* ---------- AI (Claude API, called directly from this device) ---------- */
async function claudeCall(body){
  const r = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":CFG.claudeKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:CFG.model||"claude-sonnet-5-5",max_tokens:2500,...body})});
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw {code:r.status===401?"bad_key":"api",message:(j&&j.error&&j.error.message)||("HTTP "+r.status)};
  return j;
}
const textOf = j => (j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("");
const AIX = {
  async json(prompt){
    const txt = textOf(await claudeCall({messages:[{role:"user",content:prompt}]}));
    const m = txt.match(/[\[{][\s\S]*[\]}]/);
    try { return JSON.parse(m?m[0]:txt); } catch(e){ throw {code:"invalid_json",message:"Unreadable answer"}; }
  },
  async chat(system, messages, tools){
    const defs = tools.map(x=>({name:x.name,description:x.description,input_schema:x.inputSchema}));
    const msgs = messages.slice();
    for (let round=0; round<6; round++){
      const j = await claudeCall({system,messages:msgs,tools:defs});
      if (j.stop_reason !== "tool_use") return textOf(j);
      msgs.push({role:"assistant",content:j.content});
      const results=[];
      for (const c of j.content.filter(c=>c.type==="tool_use")){
        const tool=tools.find(x=>x.name===c.name);
        try { results.push({type:"tool_result",tool_use_id:c.id,content:JSON.stringify(await tool.execute(c.input||{}))}); }
        catch(e){ results.push({type:"tool_result",tool_use_id:c.id,content:String(e.message||e),is_error:true}); }
      }
      msgs.push({role:"user",content:results});
    }
    return "";
  }
};
/* ---------- AI (OpenAI Responses API) ---------- */
async function oaiCall(body){
  const r = await fetch("https://api.openai.com/v1/responses",{method:"POST",headers:{"content-type":"application/json","Authorization":"Bearer "+CFG.openaiKey},body:JSON.stringify({model:CFG.openaiModel||"gpt-6.1-sol",reasoning:{effort:"low"},...body})});
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw {code:r.status===401?"bad_key":"api",message:(j&&j.error&&j.error.message)||("HTTP "+r.status)};
  return j;
}
const oaiText = j => (j.output||[]).filter(o=>o.type==="message").flatMap(o=>o.content||[]).filter(c=>c.type==="output_text").map(c=>c.text).join("");
const OAIX = {
  async json(prompt){
    const txt = oaiText(await oaiCall({input:prompt}));
    const m = txt.match(/[\[{][\s\S]*[\]}]/);
    try { return JSON.parse(m?m[0]:txt); } catch(e){ throw {code:"invalid_json",message:"Unreadable answer"}; }
  },
  async chat(system, messages, tools){
    const defs = tools.map(x=>({type:"function",name:x.name,description:x.description,parameters:x.inputSchema}));
    let j = await oaiCall({instructions:system,input:messages.map(m=>({role:m.role,content:m.content})),tools:defs});
    for (let round=0; round<6; round++){
      const calls=(j.output||[]).filter(o=>o.type==="function_call");
      if (!calls.length) return oaiText(j);
      const outs=[];
      for (const c of calls){
        const tool=tools.find(x=>x.name===c.name); let args={}; try{ args=JSON.parse(c.arguments||"{}"); }catch(e){}
        let out; try{ out=JSON.stringify(await tool.execute(args)); }catch(e){ out=JSON.stringify({error:String(e.message||e)}); }
        outs.push({type:"function_call_output",call_id:c.call_id,output:out});
      }
      j = await oaiCall({instructions:system,previous_response_id:j.id,input:outs,tools:defs});
    }
    return oaiText(j);
  }
};

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
/* Removes stutter-like repeats from speech recognition, e.g. "a a b a b c" -> "a b c". */
function collapseRepeats(text){
  let w=String(text||"").split(/\s+/).filter(Boolean), changed=true;
  while(changed){ changed=false;
    for(let i=0;i<w.length && !changed;i++) for(let L=Math.min(12,Math.floor((w.length-i)/2));L>=1;L--){
      let same=true; for(let k=0;k<L;k++) if(w[i+k]!==w[i+L+k]){ same=false; break; }
      if(same){ w.splice(i,L); changed=true; break; }
    }
  }
  return w.join(" ");
}
function fmtDur(ms){ const s=Math.round(ms/1000); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }

        tickEl,
        h("div",{class:"muted",style:"text-align:center"},V.state==="rec"?(engine==="whisper"?(ar?"ChatGPT يسمعك… اضغط عندما تنتهي":"ChatGPT is listening… tap when you're done"):(ar?"الهاتف يسمعك… اضغط عندما تنتهي":"Phone is listening… tap when you're done")):(ar?"اضغط وتحدث بشكل طبيعي. سأفهم وأنظم كل شيء.":"Tap and speak naturally. I'll understand and organize it."))));

function voiceCard(v){

    h("div",{class:"row",style:"justify-content:space-between"},

      h("div",{class:"row",style:"gap:4px"},

  const rows=[

    {kind:"task",title:ar?"الرد على عرض البنك بخصوص التمويل":"Reply to the bank's financing offer",q:1,due:addDays(td,-1),top:true,items:[]},
    {kind:"task",title:ar?"تجهيز عرض مجلس الإدارة":"Prepare the board meeting deck",q:2,due:addDays(td,4),top:true,items:[{t:ar?"ملخص الأداء":"Performance summary",done:false},{t:ar?"خطة ٢٠٢٧":"2027 plan",done:false}]},
    {kind:"task",title:ar?"مقابلة مرشح مدير المبيعات":"Interview the sales director candidate",q:2,due:addDays(td,2),items:[]},
    {kind:"task",title:ar?"تأكيد حجز فندق مؤتمر دبي":"Confirm hotel for the Dubai conference",q:3,due:addDays(td,1),delegate:ar?"منى":"Mona",items:[]},
    {kind:"task",title:ar?"تحديث صورة الملف على لينكدإن":"Update LinkedIn profile photo",q:4,items:[]},

    {kind:"habit",name:ar?"مشي ٣٠ دقيقة":"30-min walk",log:{[addDays(td,-1)]:true,[addDays(td,-2)]:true,[addDays(td,-4)]:true}},
    {kind:"habit",name:ar?"قراءة ٢٠ صفحة":"Read 20 pages",log:{[addDays(td,-1)]:true}}

/* ---------- render ---------- */
function go(tab){ TAB=tab; if(tab!=="ask") rememberUI(); window.scrollTo({top:0}); render(); }
function render(){
  if (!S.ready) return;
  const views={today:viewToday,tasks:viewTasks,capture:viewCapture,notes:viewNotes,habits:viewHabits,ask:viewAsk};
  const active=document.activeElement; const aid=active&&active.id; const sel=aid&&("selectionStart" in active)?[active.selectionStart,active.selectionEnd]:null;
  const keep = aid ? active.value : null;
  $("#view").replaceChildren(...(views[TAB]||viewToday)());
  if (aid){ const n=document.getElementById(aid); if(n && !n.closest(".sheet")){ if(keep!=null && n.value!==keep && aid!=="capText") n.value=keep; n.focus({preventScroll:true}); if(sel) try{n.setSelectionRange(sel[0],sel[1]);}catch(e){} } }
  document.querySelectorAll("nav.tabs [data-tab]").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===TAB?"page":"false"));
  if (sheetEl && !document.activeElement.closest?.(".sheet")) refreshSheet();
}
document.querySelectorAll("nav.tabs [data-tab]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.tab)));
$("#askBtn").addEventListener("click",()=>go("ask"));
$("#menuBtn").addEventListener("click",openSettings);
$("#fabMic").addEventListener("click",()=>openVoice());

/* ---------- boot ---------- */
applyLang();
function afterLoad(){
  S.ready=true; render();
  const st=settings();
  let fresh=false; try{ const u=+sessionStorage.getItem("mk_unlock"); fresh = u && Date.now()-u < 10*60*1000; }catch(e){}
  if (!st.pinHash) showLock("setup");
  else if (fresh) unlock();
  else showLock("unlock");
}
loadLocal(); afterLoad();
if ("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
