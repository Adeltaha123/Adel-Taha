name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-api
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # Until the CLOUDFLARE_API_TOKEN secret is added (docs/CLOUDFLARE.md), deploys happen from the PC with npm run deploy.
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the automatic deploy."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v6
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci && npm ci --prefix mobile
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run check
      # Builds the website for the Worker's address and deploys website and API together.
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/smoke-api.mjs https://mypa-api.mohamed-tamer.workers.dev
