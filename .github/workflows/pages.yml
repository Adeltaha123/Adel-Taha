name: Publish web app
on:
  push:
    branches: [main]
    paths: ['deploy/github-pages/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      # The app now lives on Cloudflare (npm run deploy). This address only forwards there; sw.js clears the
      # offline copy that browsers kept from older versions of this site.
      - run: |
          mkdir site
          cp deploy/github-pages/index.html site/index.html
          cp deploy/github-pages/index.html site/404.html
          cp deploy/github-pages/sw.js site/sw.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy web app
        id: deployment
        uses: actions/deploy-pages@v4
